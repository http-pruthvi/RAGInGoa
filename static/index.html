<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice RAG Demo - Hacker House Goa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,700&family=Outfit:wght@400;600;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-green: #09492f;
            --bg-ray: #0c5838;
            --hh-yellow: #f6c324;
            --goa-pink: #e72c51;
            --tape-pink: #ff1761;
            --card-white: #f9f6ef;
            --dark-text: #222;
        }

        body {
            background-color: var(--bg-green);
            background-image: repeating-conic-gradient(var(--bg-green) 0% 5%, var(--bg-ray) 5% 10%);
            color: var(--dark-text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 40px;
            position: relative;
        }

        .hh-title {
            font-family: 'Playfair Display', serif;
            color: var(--hh-yellow);
            font-size: 2.8rem;
            margin: 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .goa-title {
            font-family: 'Pacifico', cursive;
            color: var(--goa-pink);
            font-size: 2.5rem;
            position: absolute;
            right: -20px;
            bottom: -15px;
            transform: rotate(-10deg);
            text-shadow: 2px 2px 0px white, -1px -1px 0px white, 1px -1px 0px white, -1px 1px 0px white;
        }

        .date-line {
            color: var(--hh-yellow);
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card {
            background: var(--card-white);
            border-radius: 12px;
            padding: 30px 20px;
            width: 100%;
            max-width: 600px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transform: rotate(-1deg);
        }

        .tape-tl {
            position: absolute;
            top: -10px;
            left: 20px;
            width: 50px;
            height: 15px;
            background: var(--tape-pink);
            transform: rotate(-25deg);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .tape-br {
            position: absolute;
            bottom: -10px;
            right: 20px;
            width: 50px;
            height: 15px;
            background: var(--tape-pink);
            transform: rotate(-15deg);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .card-inner {
            transform: rotate(1deg);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--hh-yellow);
        }

        select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            background: white;
            cursor: pointer;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.1s, filter 0.1s;
            text-transform: uppercase;
        }
        .btn:hover {
            filter: brightness(1.1);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-ask {
            background: var(--hh-yellow);
            color: #443500;
        }

        .btn-record {
            background: var(--tape-pink);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-record.recording {
            animation: pulse 1s infinite;
            background: #b00020;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .loading {
            display: none;
            text-align: center;
            font-family: "Kalam", cursive;
            font-size: 1.5rem;
            color: var(--goa-pink);
            margin: 20px 0;
        }

        .result-box {
            display: none;
            margin-top: 20px;
            border-top: 2px dashed #ccc;
            padding-top: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-refused { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .transcription {
            font-size: 1.1rem;
            font-style: italic;
            color: #444;
            padding: 10px;
            background: #f1f1f1;
            border-radius: 6px;
            border-left: 4px solid var(--hh-yellow);
        }

        .answer {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #111;
            font-weight: 500;
        }

        .chunks-toggle {
            background: none;
            border: none;
            color: var(--goa-pink);
            padding: 0;
            margin-top: 20px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: underline;
        }

        .chunks-container {
            display: none;
            margin-top: 15px;
            font-size: 0.95rem;
        }
        .chunk {
            background: #fff;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .latency-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .latency-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .latency-val {
            display: block;
            font-weight: 700;
            color: var(--bg-green);
            font-size: 1.1rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="date-line">GOA, INDIA &bull; 28 - 31 OCT 2026</div>
    <h1 class="hh-title">HACKER HOUSE<span class="goa-title">Goa</span></h1>
</div>

<div class="card">
    <div class="tape-tl"></div>
    <div class="tape-br"></div>
    
    <div class="card-inner">
        <div class="input-group">
            <div class="controls-row">
                <select id="langSelect">
                    <option value="en-US">English</option>
                    <option value="hi-IN">Hindi</option>
                </select>
                <button id="voiceBtn" class="btn btn-record" onclick="toggleRecording()">?? Record</button>
            </div>
            <div class="controls-row">
                <input type="text" id="textInput" placeholder="Type a question...">
                <button id="askBtn" class="btn btn-ask" onclick="submitText()">Ask</button>
            </div>
        </div>

        <div id="loading" class="loading">Processing Magic... ?</div>

        <div id="resultBox" class="result-box">
            <div id="statusBadge" class="status-badge"></div>
            
            <div class="label">Query Input</div>
            <div id="transcriptionBox" class="transcription"></div>

            <div class="label">Generated Answer</div>
            <div id="answerBox" class="answer"></div>

            <button class="chunks-toggle" onclick="toggleChunks()">[+] View Grounding Sources</button>
            <div id="chunksContainer" class="chunks-container"></div>

            <div class="label">Latency Breakdown</div>
            <div id="latencyGrid" class="latency-grid"></div>
        </div>
    </div>
</div>

<script>
    let isRecording = false;
    let audioContext;
    let mediaStreamSource;
    let recorderNode;
    let audioData = [];
    let sampleRate;

    async function toggleRecording() {
        if (!isRecording) {
            await startRecording();
        } else {
            stopRecording();
        }
    }

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            sampleRate = audioContext.sampleRate;
            mediaStreamSource = audioContext.createMediaStreamSource(stream);
            
            recorderNode = audioContext.createScriptProcessor(4096, 1, 1);
            audioData = [];

            recorderNode.onaudioprocess = function(e) {
                if(!isRecording) return;
                const channelData = e.inputBuffer.getChannelData(0);
                audioData.push(new Float32Array(channelData));
            };

            mediaStreamSource.connect(recorderNode);
            recorderNode.connect(audioContext.destination);

            isRecording = true;
            document.getElementById('voiceBtn').classList.add('recording');
            document.getElementById('voiceBtn').innerHTML = "? Stop";
        } catch (err) {
            alert("Microphone access denied or error: " + err);
        }
    }

    function stopRecording() {
        if (isRecording) {
            isRecording = false;
            document.getElementById('voiceBtn').classList.remove('recording');
            document.getElementById('voiceBtn').innerHTML = "?? Record";
            
            if (mediaStreamSource) mediaStreamSource.mediaStream.getTracks().forEach(t => t.stop());
            if (recorderNode) recorderNode.disconnect();
            if (audioContext) audioContext.close();

            exportWAV();
        }
    }

    function exportWAV() {
        let totalLength = 0;
        for (let i = 0; i < audioData.length; i++) {
            totalLength += audioData[i].length;
        }
        
        let pcmData = new Float32Array(totalLength);
        let offset = 0;
        for (let i = 0; i < audioData.length; i++) {
            pcmData.set(audioData[i], offset);
            offset += audioData[i].length;
        }

        let intData = new Int16Array(pcmData.length);
        for (let i = 0; i < pcmData.length; i++) {
            let s = Math.max(-1, Math.min(1, pcmData[i]));
            intData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        const numChannels = 1;
        const byteRate = sampleRate * numChannels * 2;
        const blockAlign = numChannels * 2;
        const buffer = new ArrayBuffer(44 + intData.length * 2);
        const view = new DataView(buffer);

        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + intData.length * 2, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, 'data');
        view.setUint32(40, intData.length * 2, true);

        let offsetData = 44;
        for (let i = 0; i < intData.length; i++, offsetData += 2) {
            view.setInt16(offsetData, intData[i], true);
        }

        const blob = new Blob([view], { type: 'audio/wav' });
        submitVoice(blob);
    }

    function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
        }
    }

    function showLoading() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('askBtn').disabled = true;
        document.getElementById('voiceBtn').disabled = true;
    }

    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('askBtn').disabled = false;
        document.getElementById('voiceBtn').disabled = false;
    }

    function toggleChunks() {
        const cont = document.getElementById('chunksContainer');
        const btn = document.querySelector('.chunks-toggle');
        if (cont.style.display === 'block') {
            cont.style.display = 'none';
            btn.innerText = "[+] View Grounding Sources";
        } else {
            cont.style.display = 'block';
            btn.innerText = "[-] Hide Grounding Sources";
        }
    }

    function displayResult(data) {
        hideLoading();
        
        const badge = document.getElementById('statusBadge');
        badge.innerText = data.status;
        badge.className = 'status-badge';
        if (data.status === 'success') badge.classList.add('status-success');
        else if (data.status.includes('error')) badge.classList.add('status-error');
        else badge.classList.add('status-refused');

        document.getElementById('transcriptionBox').innerText = data.query_text || (data.error_message ? "Error" : "Empty");
        
        let answerText = data.answer;
        if (!answerText && data.error_message) answerText = data.error_message;
        document.getElementById('answerBox').innerText = answerText;

        const chunksCont = document.getElementById('chunksContainer');
        chunksCont.innerHTML = '';
        if (data.retrieved_chunks && data.retrieved_chunks.length > 0) {
            data.retrieved_chunks.forEach((c, idx) => {
                const chunkDiv = document.createElement('div');
                chunkDiv.className = 'chunk';
                chunkDiv.innerHTML = `<strong>[${idx+1}] ID: ${c.doc_id}</strong><br><span style="color:#666;font-size:0.8rem">Score: ${c.score.toFixed(3)} | Strategy: ${c.strategy}</span><br><br>${c.text}`;
                chunksCont.appendChild(chunkDiv);
            });
            document.querySelector('.chunks-toggle').style.display = 'block';
            chunksCont.style.display = 'none';
            document.querySelector('.chunks-toggle').innerText = "[+] View Grounding Sources";
        } else {
            document.querySelector('.chunks-toggle').style.display = 'none';
        }

        const latGrid = document.getElementById('latencyGrid');
        latGrid.innerHTML = '';
        if (data.stage_timings) {
            let total = 0;
            for (const [stage, ms] of Object.entries(data.stage_timings)) {
                total += ms;
                latGrid.innerHTML += `<div class="latency-item"><div style="font-size:0.8rem;color:#666">${stage.replace('_', ' ')}</div><span class="latency-val">${ms.toFixed(0)}ms</span></div>`;
            }
            latGrid.innerHTML = `<div class="latency-item"><div style="font-size:0.8rem;color:#666;font-weight:bold">TOTAL BACKEND</div><span class="latency-val">${total.toFixed(0)}ms</span></div>` + latGrid.innerHTML;
        }
    }

    async function submitText() {
        const text = document.getElementById('textInput').value.trim();
        if(!text) return;
        const lang = document.getElementById('langSelect').value;

        showLoading();
        try {
            const res = await fetch('/query/text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: text, language: lang })
            });
            displayResult(await res.json());
        } catch(e) {
            displayResult({status: 'error', error_message: e.toString()});
        }
    }

    async function submitVoice(audioBlob) {
        const lang = document.getElementById('langSelect').value;
        const fd = new FormData();
        fd.append('file', audioBlob, 'recording.wav');
        fd.append('language', lang);

        showLoading();
        try {
            const res = await fetch('/query/voice', {
                method: 'POST',
                body: fd
            });
            displayResult(await res.json());
        } catch(e) {
            displayResult({status: 'error', error_message: e.toString()});
        }
    }
</script>
</body>
</html>
